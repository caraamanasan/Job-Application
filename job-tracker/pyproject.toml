[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-job-tracker"
version = "0.1.0"
description = "A private, local job application tracker"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-WTF>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["job_tracker*"]

[tool.setuptools.package-data]
job_tracker = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"